<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate GST - Admin Panel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .header {
            background: #1a237e;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .container {
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .stats-grid {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            flex: 1;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            border-left: 4px solid #1a237e;
        }

        .stat-card h3 {
            margin: 0 0 5px 0;
            font-size: 28px;
            color: #1a237e;
        }

        .stat-card p {
            margin: 0;
            font-size: 13px;
            font-weight: bold;
            color: #666;
            text-transform: uppercase;
        }

        .table-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        th,
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #f8f9fa;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
        }

        tr:hover {
            background-color: #f5f7fa;
        }

        .badge-active {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid #a5d6a7;
        }

        .badge-expired {
            background: #ffebee;
            color: #c62828;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid #ffcdd2;
        }

        .btn-action {
            background: #ff9800;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            margin: 2px;
        }

        .btn-action:hover {
            background: #e65100;
        }

        .btn-block {
            background: #dc3545;
        }

        .btn-block:hover {
            background: #b02a37;
        }

        .user-details strong {
            color: #1a237e;
            font-size: 14px;
        }

        .user-details span {
            display: block;
            color: #666;
            font-size: 12px;
            margin-top: 2px;
        }
    </style>
</head>

<body>

        <h1>⚙️ Admin Control Panel - SaaS Manager</h1>
        <div style="font-weight: bold;">Welcome, Admin</div>
    </div>

            <div class="stat-card" style="border-left-color: #c62828;">

        <div class="table-container">

                </tbody>
            </table>
        </div>
    </div>
