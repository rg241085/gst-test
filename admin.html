<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate GST - Admin Panel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .header {
            background: #1a237e;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .container {
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .stats-grid {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            flex: 1;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            border-left: 4px solid #1a237e;
        }

        .stat-card h3 {
            margin: 0 0 5px 0;
            font-size: 28px;
            color: #1a237e;
        }

        .stat-card p {
            margin: 0;
            font-size: 13px;
            font-weight: bold;
            color: #666;
            text-transform: uppercase;
        }

        .table-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        th,
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #f8f9fa;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
        }

        tr:hover {
            background-color: #f5f7fa;
        }

        .badge-active {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid #a5d6a7;
        }

        .badge-expired {
            background: #ffebee;
            color: #c62828;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid #ffcdd2;
        }

        .btn-action {
            background: #ff9800;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            margin: 2px;
        }

        .btn-action:hover {
            background: #e65100;
        }

        .btn-block {
            background: #dc3545;
        }

        .btn-block:hover {
            background: #b02a37;
        }

        .user-details strong {
            color: #1a237e;
            font-size: 14px;
        }

        .user-details span {
            display: block;
            color: #666;
            font-size: 12px;
            margin-top: 2px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>⚙️ Admin Control Panel - SaaS Manager</h1>
        <div style="font-weight: bold;">Welcome, Admin</div>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="totalUsers">0</h3>
                <p>Total Users</p>
            </div>
            <div class="stat-card" style="border-left-color: #2e7d32;">
                <h3 id="activeUsers">0</h3>
                <p>Active Subscriptions</p>
            </div>
            <div class="stat-card" style="border-left-color: #c62828;">
                <h3 id="expiredUsers">0</h3>
                <p>Expired / Blocked</p>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Customer Details</th>
                        <th>Contact Info</th>
                        <th>Plan</th>
                        <th>Expiry Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="6" style="text-align: center;">Loading users... ⏳</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8fQTZ8mw4ABYJmPh1pQH_hilEhkSI9jE",
            authDomain: "ultimate-gst-saas.firebaseapp.com",
            projectId: "ultimate-gst-saas",
            storageBucket: "ultimate-gst-saas.firebasestorage.app",
            messagingSenderId: "791122268097",
            appId: "1:791122268097:web:adefdc6856a93f87312940"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadUsers() {
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                let html = '';
                let activeCount = 0; let expiredCount = 0;

                if (querySnapshot.empty) {
                    document.getElementById('userTableBody').innerHTML = `<tr><td colspan="6" style="text-align: center; color: #666;">कोई यूज़र नहीं मिला।</td></tr>`;
                    return;
                }

                querySnapshot.forEach((document) => {
                    let user = document.data();
                    let uid = document.id;

                    let today = new Date().toISOString().split('T')[0];
                    let isExpired = user.expiryDate < today || user.status === 'Blocked';
                    if (isExpired) expiredCount++; else activeCount++;

                    let statusBadge = isExpired ? `<span class="badge-expired">EXPIRED</span>` : `<span class="badge-active">ACTIVE</span>`;

                    // Handling empty fields if old user exists
                    let name = user.name || 'N/A';
                    let firm = user.firmName || 'N/A';
                    let gst = user.gstNumber ? `GST: ${user.gstNumber}` : '';
                    let mobile = user.mobile || 'N/A';
                    let email = user.email || 'N/A';

                    html += `
                        <tr>
                            <td class="user-details">
                                <strong>${name}</strong>
                                <span>🏢 ${firm}</span>
                                <span style="color:#e65100; font-weight:bold;">${gst}</span>
                            </td>
                            <td class="user-details">
                                <span>📞 ${mobile}</span>
                                <span>✉️ ${email}</span>
                            </td>
                            <td>${user.plan || 'Free Trial'}</td>
                            <td style="font-weight: bold; color: ${isExpired ? '#c62828' : '#333'}">${user.expiryDate}</td>
                            <td>${statusBadge}</td>
                            <td>
                                <button class="btn-action" onclick="window.extendPlan('${uid}', '${user.expiryDate}')">📅 Extend</button>
                                <button class="btn-action btn-block" onclick="window.blockUser('${uid}')">🚫 Block</button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('userTableBody').innerHTML = html;
                document.getElementById('totalUsers').innerText = activeCount + expiredCount;
                document.getElementById('activeUsers').innerText = activeCount;
                document.getElementById('expiredUsers').innerText = expiredCount;

            } catch (error) {
                console.error(error);
                document.getElementById('userTableBody').innerHTML = `<tr><td colspan="6" style="color: red; text-align: center;">⚠️ Database Error</td></tr>`;
            }
        }

        window.extendPlan = async function (uid, currentDate) {
            let newDate = prompt(`मौजूदा Expiry Date: ${currentDate}\nकृपया नई Expiry Date डालें (YYYY-MM-DD):`);
            if (newDate) {
                try {
                    await updateDoc(doc(db, "users", uid), { expiryDate: newDate, status: "Active" });
                    alert("✅ Plan successfully extended!");
                    loadUsers();
                } catch (error) { alert("⚠️ Error updating plan."); }
            }
        };

        window.blockUser = async function (uid) {
            if (confirm("क्या आप सच में इस यूज़र को ब्लॉक करना चाहते हैं?")) {
                try {
                    await updateDoc(doc(db, "users", uid), { status: "Blocked", expiryDate: "2000-01-01" });
                    alert("🚫 User Blocked successfully!");
                    loadUsers();
                } catch (error) { alert("⚠️ Error blocking user."); }
            }
        };

        loadUsers();
    </script>
</body>

</html>
