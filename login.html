<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate GST - Login / Sign Up</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .login-card { background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-card h2 { margin: 0 0 10px 0; color: #1a237e; font-size: 24px; }
        .login-card p { color: #666; font-size: 14px; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 5px; font-size: 14px; box-sizing: border-box; outline: none; }
        .input-group input:focus { border-color: #1a237e; }
        
        /* Extra fields hidden by default (for login mode) */
        .signup-fields { display: none; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-primary { background: #1a237e; color: #fff; }
        .btn-primary:hover { background: #121858; }
        
        .btn-google { background: #fff; color: #333; border: 1px solid #ced4da; }
        .btn-google:hover { background: #f8f9fa; }
        .btn-google img { width: 18px; }

        .divider { display: flex; align-items: center; margin: 20px 0; color: #999; font-size: 12px; text-transform: uppercase; }
        .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #e0e0e0; }
        .divider::before { margin-right: 10px; } .divider::after { margin-left: 10px; }

        .toggle-text { font-size: 13px; color: #666; margin-top: 15px; }
        .toggle-text span { color: #1a237e; font-weight: bold; cursor: pointer; text-decoration: underline; }

        #errorMsg { color: #d32f2f; font-size: 12px; font-weight: bold; margin-bottom: 15px; display: none; background: #ffebee; padding: 8px; border-radius: 4px; border: 1px solid #ffcdd2; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 id="formTitle">Welcome Back</h2>
        <p id="formSubtitle">Login to your Ultimate GST account</p>

        <div id="errorMsg"></div>

        <!-- Google Login Button -->
        <button class="btn btn-google" onclick="handleGoogleAuth()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
            Continue with Google
        </button>

        <div class="divider">OR</div>

        <!-- Signup Specific Fields -->
        <div class="signup-fields" id="signupFields">
            <div class="input-group">
                <label>Full Name <span style="color:red;">*</span></label>
                <input type="text" id="fullName" placeholder="Rahul Kumar">
            </div>
            <div class="input-group">
                <label>Mobile / WhatsApp Number <span style="color:red;">*</span></label>
                <input type="tel" id="mobile" placeholder="9876543210">
            </div>
            <div class="input-group">
                <label>Company / Firm Name <span style="color:red;">*</span></label>
                <input type="text" id="firmName" placeholder="M/s Sharma Traders">
            </div>
            <div class="input-group">
                <label>GST Number (Optional)</label>
                <input type="text" id="gstNum" placeholder="08ABCDE1234F1Z5">
            </div>
        </div>

        <!-- Common Fields -->
        <div class="input-group">
            <label>Email Address <span style="color:red;">*</span></label>
            <input type="email" id="email" placeholder="you@company.com">
        </div>
        <div class="input-group">
            <label>Password <span style="color:red;">*</span></label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button class="btn btn-primary" id="mainBtn" onclick="handleAuth()">Login</button>

        <div class="toggle-text" id="toggleDiv">
            New user? <span onclick="toggleForm()">Create a 7-Day Free Trial</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8fQTZ8mw4ABYJmPh1pQH_hilEhkSI9jE",
            authDomain: "ultimate-gst-saas.firebaseapp.com",
            projectId: "ultimate-gst-saas",
            storageBucket: "ultimate-gst-saas.firebasestorage.app",
            messagingSenderId: "791122268097",
            appId: "1:791122268097:web:adefdc6856a93f87312940"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        let isLoginMode = true;

        window.toggleForm = function() {
            isLoginMode = !isLoginMode;
            document.getElementById('signupFields').style.display = isLoginMode ? 'none' : 'block';
            document.getElementById('formTitle').innerText = isLoginMode ? "Welcome Back" : "Create Account";
            document.getElementById('formSubtitle').innerText = isLoginMode ? "Login to your Ultimate GST account" : "Fill details to start 7-Day Free Trial";
            document.getElementById('mainBtn').innerText = isLoginMode ? "Login" : "Sign Up & Start Trial";
            document.getElementById('toggleDiv').innerHTML = isLoginMode 
                ? `New user? <span onclick="toggleForm()">Create a 7-Day Free Trial</span>` 
                : `Already have an account? <span onclick="toggleForm()">Login here</span>`;
            document.getElementById('errorMsg').style.display = 'none';
        }

        function showError(msg) {
            let errDiv = document.getElementById('errorMsg');
            errDiv.innerText = "⚠️ " + msg;
            errDiv.style.display = 'block';
        }

        // Email & Password Auth
        window.handleAuth = async function() {
            let email = document.getElementById('email').value.trim();
            let password = document.getElementById('password').value.trim();

            if (!email || !password) { showError("Please enter Email and Password."); return; }

            document.getElementById('mainBtn').innerText = "Processing... ⏳";

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                    window.location.href = "index.html"; 
                } else {
                    let fullName = document.getElementById('fullName').value.trim();
                    let mobile = document.getElementById('mobile').value.trim();
                    let firmName = document.getElementById('firmName').value.trim();
                    let gstNum = document.getElementById('gstNum').value.trim();

                    if (!fullName || !mobile || !firmName) {
                        showError("Please fill all the required (*) fields.");
                        document.getElementById('mainBtn').innerText = "Sign Up & Start Trial";
                        return;
                    }

                    const userCred = await createUserWithEmailAndPassword(auth, email, password);
                    await createDatabaseRecord(userCred.user.uid, email, fullName, mobile, firmName, gstNum);
                    
                    alert("✅ Account created successfully! Your 7-Day Free Trial has started.");
                    window.location.href = "index.html";
                }
            } catch (error) {
                console.error(error);
                showError(error.message.replace("Firebase:", ""));
                document.getElementById('mainBtn').innerText = isLoginMode ? "Login" : "Sign Up & Start Trial";
            }
        }

        // Google Auth
        window.handleGoogleAuth = async function() {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;

                // Check if user is new in database
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    // New Google User -> Create 7 day trial with default empty fields
                    await createDatabaseRecord(user.uid, user.email, user.displayName, "Not Provided", "Not Provided", "");
                }
                
                window.location.href = "index.html";
            } catch (error) {
                console.error(error);
                showError("Google Sign-In failed or was cancelled.");
            }
        }

        // Function to create user record in Firestore
        async function createDatabaseRecord(uid, email, name, mobile, firm, gst) {
            let today = new Date();
            today.setDate(today.getDate() + 7);
            let expiryString = today.toISOString().split('T')[0];

            await setDoc(doc(db, "users", uid), {
                email: email,
                name: name,
                mobile: mobile,
                firmName: firm,
                gstNumber: gst,
                plan: "Free Trial",
                expiryDate: expiryString,
                status: "Active",
                createdAt: new Date().toISOString().split('T')[0]
            });
        }
    </script>
</body>
</html>
